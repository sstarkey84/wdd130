<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us | White Water Rafting</title>
    <meta name="description"
      content="Contact Kern River White Water Adventures for reservations, questions, and rafting trip information.">
    <meta name="author" content="Scott Starkey">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="White water rafting logo" width="200">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="contact-title">Kern River White Water Adventures</h1>
        <h1 class="contact-title">Contact Us</h1>

        <section class="contact-info">
            <h2>Contact Information</h2>
            <p>1301 Kernville Road</p>
            <p>Kernville, CA</p>
            <p>(661)398-7745</p>
            <p>info@kernriverrafting.com</p>
        </section>

        <section class="contact-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d4578.984915577792!2d-118.4214742579675!3d35.75495138742614!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1780376358307!5m2!1sen!2sus"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-row">
                    <label>Message Purpose</label>
                    <div class="radio-options">
                        <label><input type="radio" id="general" name="purpose" checked>
                            General
                            Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"> Reservation
                            Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"> Website
                            Suggestion</label>
                    </div>
                </div>
                <div class="message-row">
                    <label class="message-label" for="message">Message</label>
                    <textarea id="message" name="message" rows="5"></textarea>
                </div>

                <label class="newsletter"><input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the
                    monthly
                    newsletter</label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We are Here to Serve You</h2>
            <figure>
                <img src="images/guide1.jpg" alt="River Guide">
                <figcaption>James Smith - River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/guide2.jpg" alt="River Guide">
                <figcaption>Robert Smith - Reservation Manager</figcaption>
            </figure>
            <figure>
                <img src="images/guide3.jpg" alt="River Guide">
                <figcaption>Fabian Torres - Trip Coordinator</figcaption>
            </figure>
        </section>
    </main>


    <footer>
        <p>&copy;2026 | Kern River White Water Adventures | Scott Starkey</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
