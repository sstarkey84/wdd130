<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>

                <div class="form-item column2">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
            </fieldset>

            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser">
                        What is your favorite browser?
                    </label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="pet">
                        Do you have a household pet?
                    </label>
                    <input type="checkbox" id="pet" name="pet">
                </div class="form-item column1">
                <label class="places-label" for"places">
                    List the places you have lived:
                </label>
                <textarea id="places" name="places"
                  rows="4">Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali</textarea>
            </fieldset>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>
        <p>
            &copy;2026 | HTML Form -User Poll Activity | Scott Starkey
        </p>
    </footer>
